<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Media Hub Monitoring Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 0.5rem;
    }
    .status-card {
      background-color: #1e293b;
      border-radius: 0.5rem;
      padding: 1.5rem;
      margin-top: 1.5rem;
      border: 1px solid #475569;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.875rem;
    }
    .status-healthy {
      background-color: #059669;
      color: #ecfdf5;
    }
    .timestamp {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Monitoring Dashboard</h1>
  <div class="status-card">
    <h2>System Status: <span class="status-badge status-healthy">Stub Active</span></h2>
    <p class="timestamp">Last updated: <span id="last-updated">Initial Setup</span></p>
    <p>The monitoring background runner is initialized and running.</p>
  </div>
</body>
</html>
