name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync_to_hub:
    name: Push to Hugging Face Space
    runs-on: ubuntu-latest
    # Runs automatically once HF_SPACE_REPO (e.g. username/celestial-media-hub) and HF_TOKEN secret are configured
    if: ${{ vars.HF_SPACE_REPO != '' }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set. Skipping sync."
            exit 0
          fi
          git push --force "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" HEAD:main
